name: CI

on:
  push:
  pull_request:

# Redis and Postgres run as service containers; nothing talks to a hosted database.
env:
  DATABASE_URL: postgresql://postgres:password@localhost:5432/relaydesk_test
  TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/relaydesk_test
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  CACHE_REDIS_HOST: localhost
  CACHE_REDIS_PORT: 6379
  JWT_SECRET: ci_jwt_secret_at_least_32_characters_long_12345
  JWT_REFRESH_SECRET: ci_refresh_secret_at_least_32_characters_long_1234
  VISITOR_TOKEN_SECRET: ci_visitor_secret_at_least_32_characters_long_123
  CORS_ORIGIN: http://localhost:3000,http://localhost:5173
  WEB_ORIGIN: http://localhost:3000
  WIDGET_ORIGIN: http://localhost:5173
  EMAIL_FROM: ci@relaydesk.invalid
  PORT: 4000
  NODE_ENV: development
  DEMO_SESSIONS_PER_HOUR: 1000

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from `packageManager` in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # --frozen-lockfile: a package.json change without its pnpm-lock.yaml fails here, not on deploy.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: relaydesk_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: password }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/types build
      # Migrations, then the deferred member references (a fresh database doesn't select that migration).
      - run: pnpm --filter server db:deploy
      - run: pnpm --filter server test

  e2e:
    runs-on: ubuntu-latest
    needs: server-tests
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: relaydesk_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: password }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/types build
      - run: pnpm --filter server db:deploy
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      # Playwright starts the API, web, widget and test-site servers itself (see apps/e2e/playwright.config.ts).
      - run: pnpm --filter e2e test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
